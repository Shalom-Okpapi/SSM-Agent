name: SMM Expert Agent

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: smm-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SMM Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL || 'meta/llama-3.1-8b-instruct' }}
          DM_POLL_WINDOW_SECONDS: "240"
        run: python smm_bot.py

      - name: Commit state
        run: |
          git config user.name "SMM Bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add *.json
          git diff --staged --quiet || git commit -m "Update SMM state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || true
